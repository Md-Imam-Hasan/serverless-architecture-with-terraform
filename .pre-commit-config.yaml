# Pre-commit hooks configuration
# See https://pre-commit.com for more information

# Global exclude patterns
exclude: ^venv/|^\.terraform/

repos:
  # General file checks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace
    exclude: ^\.terraform/
  - id: end-of-file-fixer
    exclude: ^\.terraform/
  - id: check-yaml
    args: [--unsafe]
  - id: check-added-large-files
    args: [--maxkb=15000]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: detect-private-key
  - id: mixed-line-ending

  # Go linting and formatting
- repo: https://github.com/dnephin/pre-commit-golang
  rev: v0.5.1
  hooks:
  - id: go-fmt

- repo: local
  hooks:
  - id: go-vet
    name: go vet
    entry: bash -c 'cd lambda/create_payment/src && go vet ./...'
    language: system
    files: \.go$
    pass_filenames: false
  - id: go-mod-tidy
    name: go mod tidy
    entry: bash -c 'cd lambda/create_payment/src && go mod tidy'
    language: system
    files: \.go$
    pass_filenames: false
  - id: golangci-lint
    name: golangci-lint
    entry: bash -c 'export PATH=$PATH:$(go env GOPATH)/bin && cd lambda/create_payment/src && golangci-lint run --timeout=5m'
    language: system
    files: \.go$
    pass_filenames: false

  # Terraform formatting and validation
- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: v1.88.0
  hooks:
  - id: terraform_fmt
  - id: terraform_validate
  - id: terraform_tflint
    args:
    - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # YAML formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.12.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^\.terraform/

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.29.0
  hooks:
  - id: gitleaks

name: Build and Deploy to Terraform Cloud

on:
  push:
    branches:
    - dev

env:
  AWS_REGION: ap-southeast-1
  LAMBDA_ARTIFACTS_BUCKET: dev-lambda-artifacts-776724785158

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Build and Upload Lambda Functions
      run: |
        chmod +x scripts/build-and-upload-lambdas.sh
        ./scripts/build-and-upload-lambdas.sh

    - name: Trigger Terraform Cloud Run
      env:
        TFC_TOKEN: ${{ secrets.TF_API_TOKEN }}
        WORKSPACE_ID: ${{ secrets.TFC_WORKSPACE_ID }}
      run: |
        echo "Triggering Terraform Cloud run..."
        RUN_ID=$(curl -s \
          --header "Authorization: Bearer $TFC_TOKEN" \
          --header "Content-Type: application/vnd.api+json" \
          --request POST \
          --data '{
            "data": {
              "attributes": { "message": "Deploy Go Lambda from GitHub Actions", "is-destroy": false },
              "type": "runs",
              "relationships": {
                "workspace": { "data": { "type": "workspaces", "id": "'"$WORKSPACE_ID"'" } }
              }
            }
          }' \
          https://app.terraform.io/api/v2/runs | jq -r '.data.id')

        echo "Run ID: $RUN_ID"

        echo "Waiting for Terraform run to complete..."
        until curl -s \
          --header "Authorization: Bearer $TFC_TOKEN" \
          https://app.terraform.io/api/v2/runs/$RUN_ID | grep -q '"status":"applied"'; do
          echo "Waiting for run to complete..."
          sleep 15
        done

        echo "Terraform run completed!"

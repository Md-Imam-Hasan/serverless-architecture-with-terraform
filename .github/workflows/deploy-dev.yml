name: Build and Deploy to Terraform Cloud

on:
  push:
    branches:
    - dev

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache-dependency-path: lambda/create_payment/src/go.sum

    - name: Build Lambda Binary
      run: |
        echo "Building Go Lambda binary..."
        cd lambda/create_payment
        make build
        ls -lh src/bootstrap
        file src/bootstrap

    - name: Commit Built Binary
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add lambda/create_payment/src/bootstrap
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: build Lambda binary [skip ci]"
          git push origin dev
        fi

    - name: Trigger Terraform Cloud Run
      env:
        TFC_TOKEN: ${{ secrets.TF_API_TOKEN }}
        WORKSPACE_ID: ${{ secrets.TFC_WORKSPACE_ID }}
      run: |
        echo "Triggering Terraform Cloud run..."
        RUN_ID=$(curl -s \
          --header "Authorization: Bearer $TFC_TOKEN" \
          --header "Content-Type: application/vnd.api+json" \
          --request POST \
          --data '{
            "data": {
              "attributes": { "message": "Triggered from GitHub Actions", "is-destroy": false },
              "type": "runs",
              "relationships": {
                "workspace": { "data": { "type": "workspaces", "id": "'"$WORKSPACE_ID"'" } }
              }
            }
          }' \
          https://app.terraform.io/api/v2/runs | jq -r '.data.id')

        echo "Run ID: $RUN_ID"

        echo "Fetching logs from Terraform Cloud..."
        until curl -s \
          --header "Authorization: Bearer $TFC_TOKEN" \
          https://app.terraform.io/api/v2/runs/$RUN_ID | grep -q '"status":"applied"'; do
          echo "Waiting for run to complete..."
          sleep 15
        done

        echo "✅ Terraform run completed!"
